[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ndarray = "0.15"
unicode-normalization = "0.1"
shared = { path = "../shared" }
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }

[profile.release]
opt-level = 3
lto = true
